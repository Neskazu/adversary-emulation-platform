name: Adversary Emulation Platform CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements.txt

      - name: YAML lint (yamllint)
        run: |
          yamllint .
        continue-on-error: true

      - name: Security scan (Bandit)
        run: |
          bandit -r tools/ -ll

      - name: Python lint (flake8)
        run: |
          flake8 tools/ \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics

          flake8 tools/ \
            --count \
            --exit-zero \
            --max-complexity=10 \
            --max-line-length=127 \
            --statistics

      - name: Validate repository structure
        run: |
          python tools/validate_repo.py

      - name: Ansible lint
        run: |
          ansible-lint ansible/site.yml

      - name: JSON syntax check
        shell: bash
        run: |
          errors=0
          find attacks/ -name "*.json" -print0 | while IFS= read -r -d '' f; do
            python3 -m json.tool "$f" > /dev/null || {
              echo "Invalid JSON: $f"
              errors=$((errors+1))
            }
          done
          if [ "$errors" -ne 0 ]; then
            exit 1
          fi